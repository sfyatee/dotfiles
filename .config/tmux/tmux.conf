# set key bindings
unbind '"'
unbind C-b
unbind s

bind '"' choose-tree -F '#{window_id}: #F#W' -O index
set -g prefix C-a
bind C-a next-window
bind a send-prefix
bind s split-window -v
bind S split-window -h
bind space next-window
bind C-space next-window

# set history really high
set -g history-limit 50000

# show cpu/mem
set -g status-interval 2
set-option -g status-right "#(tmux-mem-cpu-load --interval 2)"
set-option -g status-right-length 60

# quality of life changes
set -g escape-time 20
set -g mouse on
set -sa terminal-features "*:RGB:osc7"
set -g renumber-window on

# colors hurt my eyes
set -g status-style reverse,bright
set -g message-style reverse

# status settings
set -g set-titles on
set -g set-titles-string "#W"
set -g status-left ""
set -g status-position top

# misc
set -g focus-events on
