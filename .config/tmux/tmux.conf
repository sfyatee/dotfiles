# Change the prefix key to C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -s set-clipboard on
set -g allow-passthrough on
set -sa terminal-features '*:RGB:osc7'
set -g mouse on
set -g set-titles on
set -g status-style 'fg=cyan,bg=#5A564F'
set -g status-position top
set -g renumber-windows on

set -g default-shell /usr/local/bin/rc

unbind c
unbind s
unbind l
unbind x
unbind '"'
unbind %

bind a send-prefix
bind c neww -a -c '#{pane_current_path}'
bind R source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; \
    display-message "source-file done"
bind S splitw -v -c '#{pane_current_path}'
bind s splitw -h -c '#{pane_current_path}'
bind X confirm-before killp
bind k confirm-before killw
bind '"' command-prompt "find-window -NT '%%'"

bind ^a last-window
bind ^k confirm-before killw

# Status stuff.
set -g status-left-style fg=darkgoldenrod4,bg=lightgoldenrod3
set -g status-left-length 30
set -g status-left "[#{session_name}]"
set -g status-right-length 30
set -g status-right-style fg=antiquewhite1,bg=blue
set -g status-right "#{?client_prefix,#[reverse][^a]#[noreverse],}#[bg=#A57922][%a-%m-%d %H:%M]"
set -g display-panes-active-colour red
set -g display-panes-colour green
set -g display-panes-time 4000

set -gw mode-style bg=blue,fg=yellow
set -gw mode-keys vi

set -g window-status-separator "| "
set -g window-status-style fg=silver
set -g window-status-bell-style fg=black,bg=#F03B3B
set -g window-status-format "#I:#W:#{window_flags}"
set -g window-status-current-style fg=ivory,bg=#777470
set -g window-status-current-format "#I:#W:#{window_flags}"

set-hook -g after-select-pane \
    'run-shell -b "printf \"\\033]7;%s\\033\\\\\" #{q:pane_path} >#{q:client_tty}"'

set-hook -g after-select-window \
    'run-shell -b "printf \"\\033]7;%s\\033\\\\\" #{q:pane_path} >#{q:client_tty}"'

# Let a terminal's "focus" events to get passed to program
set -g focus-events on

# Sessions
new -d -sуйди -d -nmail 'exec top'
neww -d -nirc 'exec senpai'
neww -d
neww -d

new -d -sother -d
linkw -sуйди:irc -tother:1
swapw -sother:1 -tother:0
