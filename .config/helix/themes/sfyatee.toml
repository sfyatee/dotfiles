"attribute" = { fg = "#f2f4f8" }
"keyword" = "#a8a8a8"
"keyword.control" = "#a8a8a8" # for, if, while
"keyword.operator" = "#c6c6c6"
"keyword.directive" = "#a8a8a8"
"keyword.storage" = "#c6c6c6" # static (c)
"namespace" = { fg = "#0d0b07" }
"punctuation" = "#f2f4f8"
"punctuation.delimiter" = "#c6c6c6" # pointer (c)
"punctuation.bracket" = "#f2f4f8" # [[
"punctuation.special" = { fg = "#f2f4f8", modifiers = ["italic"] } # '$'
"operator" = "#c6c6c6"
"special" = "blue"
"variable" = "#ffffff"
# "variable.builtin" = "DBlack" # LANG (sh)
"variable.parameter" = { fg = "#f2f4f8", modifiers = ["italic"] }
"variable.other.member" = "#ffffff"
"type" = { fg = "#f2f4f8", modifiers = ["italic"] } # void (c)
"constructor" = "green"
function = { fg = "#ffffff", modifiers = ["bold"] }
# "tag" = "orange"
"comment" = "#6f6f6f"
"constant" = "#c6c6c6"
# "constant.builtin" = "#393939"
# "constant.builtin.boolean" = "#0d0b07"
# "constant.numeric" = "#393939"
# "constant.character.escape" = "green"
"string" = "#a8a8a8" # include "grey2" (c)
# used for lifetimes
"label" = "#f2f4f8"

"markup.heading.marker" = "grey1"
"markup.list" = "red"
"markup.bold" = { fg = "#000000", modifiers = ["bold"] }
"markup.italic" = { fg = "#0d0b07", modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "#44aa99", underline = { style = "line" } }
"markup.link.label" = "orange"
"markup.link.text" = "purple"
"markup.quote" = "grey1"
"markup.raw.inline" = "green"
"markup.raw.block" = "aqua"

"diff.plus" = { fg = "grey2", modifiers = ["bold"] }
"diff.minus" = "grey1"
"diff.delta" = { fg = "fg", modifiers = ["bold"] } # branch name in commit

