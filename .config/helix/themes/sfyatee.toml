"attribute" = { fg = "purple", modifiers = ["italic"] }
"keyword" = "grey1" # export (sh)
"keyword.control" = "grey2" # for, if, while
"keyword.operator" = "red"
"keyword.directive" = "grey2" # -- preprocessor comments (#if in C)
"keyword.storage" = "grey1" # static (c)
"namespace" = { fg = "#0d0b07" }
"punctuation" = "purple" # doesn't seem to do anything
"punctuation.delimiter" = "#393939" # pointer (c)
"punctuation.bracket" = "grey0" # [[
"punctuation.special" = { fg = "fg", modifiers = ["italic"] } # $1, $HOME, the 'dollar sign'
"operator" = "#393939" # ==
"special" = "blue"
"variable" = "DBlack" # font= (sh)
"variable.builtin" = "DBlack" # LANG (sh)
"variable.parameter" = "DBlack" # c // devdraw.c line 26
"variable.other.member" = "DBlack" # screenimage // devdraw.c line 26
"type" = { fg = "#0d0b07", modifiers = ["italic"] } # void (c)
"constructor" = "green"
"function" = { fg = "DBlack", modifiers = ["bold"] }
"function.macro" = "green"
"tag" = "orange"
"comment" = { fg = "grey0", modifiers = ["italic"] }
"constant" = "fg"
"constant.builtin" = { fg = "#393939" }
"constant.builtin.boolean" = "purple"
"constant.numeric" = "#393939"
"constant.character.escape" = "green"
"string" = "grey2" # include "grey2" (c)
"string.regexp" = "DDarkgreen"
"string.special" = "yellow"
# used for lifetimes
"label" = "#0d0b07"

"markup.heading.marker" = "grey1"
"markup.heading.1" = { fg = "red", modifiers = ["bold"] }
"markup.heading.2" = { fg = "orange", modifiers = ["bold"] }
"markup.heading.3" = { fg = "yellow", modifiers = ["bold"] }
"markup.heading.4" = { fg = "green", modifiers = ["bold"] }
"markup.heading.5" = { fg = "blue", modifiers = ["bold"] }
"markup.heading.6" = { fg = "purple", modifiers = ["bold"] }
"markup.list" = "red"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "#a3ccbd", underline = { style = "line" } }
"markup.link.label" = "orange"
"markup.link.text" = "purple"
"markup.quote" = "grey1"
"markup.raw.inline" = "green"
"markup.raw.block" = "aqua"

"diff.plus" = "green"
"diff.minus" = "red"
"diff.delta" = { fg = "fg", modifiers = ["bold"] } # branch name in commit

# TODO: differentiate doc comment
# concat (ERROR) @error.syntax and "MISSING ;" selectors for errors

"ui.background" = { bg = "#ffffea" }
"ui.background.separator" = "grey0"
"ui.linenr" = "grey0"
"ui.linenr.selected" = "grey2"
"ui.statusline" = { fg = "#887777", bg = "#f6f9e1" }
# "ui.statusline.inactive" = { fg = "#ff00dd", bg = "bg1" }
"ui.statusline.normal" = { fg = "DBlack", bg = "#f6f9e1", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "DBlack", bg = "#c6c6c6", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "DBlack", bg = "#72dec2", modifiers = ["bold"] }
"ui.popup" = { fg = "DBlack", bg = "#eaebd2" }
"ui.picker.header" = { modifiers = ["bold", "underlined"] }
"ui.window" = { fg = "bg4", bg = "purple" }
"ui.help" = { fg = "DBlack", bg = "DWhite" }
"ui.text" = { fg = "DBlack" }
"ui.text.focus" = "fg"
"ui.text.directory" = { fg = "#887777" }
"ui.virtual.ruler" = { bg = "#f6f9e1" }
"ui.virtual.whitespace" = { fg = "bg4" }
"ui.virtual.inlay-hint" = { fg = "grey0" }
"ui.virtual.wrap" = { fg = "grey0" }

"ui.virtual.indent-guide" = { fg = "bg4" }

"ui.selection" = { fg = "DBlack", bg = "#72dec2" }
# TODO: namespace ui.cursor as ui.selection.cursor?
"ui.cursor.select" = { bg = "DBlack" }
"ui.cursor.insert" = { bg = "DBlack" }
"ui.cursor.primary.select" = { fg = "DBlack", bg = "#f4f4f4" }
"ui.cursor.primary.insert" = { fg = "DBlack", bg = "#c6c6c6" }
"ui.cursor.match" = { bg = "DBlack", modifiers = ["bold"] }
"ui.cursor" = { fg = "#ffffea", bg = "DBlack" }
"ui.cursorline.primary" = { bg = "#f6f9e1" }
"ui.menu" = { fg = "DBlack", bg = "#d8d9c0" }
"ui.menu.selected" = { fg = "DBlack", bg = "#72dec2" }

"diagnostic.hint" = { underline = { color = "green", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.warning" = { underline = { color = "yellow", style = "curl" } }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

"warning" = "yellow"
"error" = "red"
"info" = { fg = "DBlack", bg = "#58bcae", modifiers = ["bold"] }
"hint" = "green"

