"ui.linenr" = "#c6c6c6"
"ui.linenr.selected" = "#221e19"
"ui.statusline" = { fg = "#221e19", bg = "#e5e5d2" }
# "ui.statusline.inactive" = { fg = "#ff00dd", bg = "bg1" }
"ui.statusline.normal" = { fg = "#221e19", bg = "#b2b2a3" }
"ui.statusline.insert" = { fg = "#221e19", bg = "#b2b2a3" }
"ui.statusline.select" = { fg = "#221e19", bg = "#b2b2a3" }
"ui.popup" = { fg = "#221e19", bg = "#f4f4f4" }
# "ui.picker.header" = { bg = "purple", modifiers = ["bold", "underlined"] }
# "ui.window" = { fg = "bg4", bg = "purple" }
# "ui.help" = { fg = "DBlack", bg = "DWhite" }
"ui.text" = { fg = "#f2f4f8" }
"ui.text.focus" = "fg"
"ui.text.directory" = { fg = "#887777" }
"ui.virtual.ruler" = { bg = "#e9e9e9" }
# "ui.virtual.whitespace" = { fg = "bg4" }
# "ui.virtual.inlay-hint" = { fg = "#939f91" }
# "ui.virtual.wrap" = { fg = "#939f91" }

"ui.virtual.indent-guide" = { fg = "bg4" }

"ui.selection" = { fg = "DBlack", bg = "#72dec2" }
# TODO: namespace ui.cursor as ui.selection.cursor?
"ui.cursor.select" = { bg = "DBlack" }
"ui.cursor.insert" = { bg = "DBlack" }
"ui.cursor.primary.select" = { fg = "DBlack", bg = "#f4f4f4" }
"ui.cursor.primary.insert" = { fg = "DBlack", bg = "#c6c6c6" }
"ui.cursor.match" = { bg = "DBlack", modifiers = ["bold"] }
"ui.cursor" = { fg = "#000000", bg = "#ffffff" }
# "ui.cursorline.primary" = { bg = "#f6f9e1" }
"ui.menu" = { fg = "#221e19", bg = "#e9e9e9" }
"ui.menu.selected" = { fg = "#000000", bg = "#72dec2" }

"diagnostic.hint" = { underline = { color = "green", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.warning" = { underline = { color = "yellow", style = "curl" } }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

"warning" = "yellow"
"error" = "red"
"info" = { fg = "#ff6663", modifiers = ["bold", "dim"] }
"hint" = "green"

