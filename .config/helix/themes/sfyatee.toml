"type" = { fg = "#0d0b07", modifiers = ["italic"] } # void (c)
"constant" = "fg"
"constant.builtin" = { fg = "purple", modifiers = ["italic"] }
"constant.builtin.boolean" = "purple"
"constant.numeric" = "#393939"
"constant.character.escape" = "green"
"string" = "grey2" # include "grey2" (c)
"string.regexp" = "green"
"string.special" = "yellow"
"comment" = { fg = "grey0", modifiers = ["italic"] }
"variable" = "black" # font= (sh)
"variable.builtin" = "black" # LANG (sh)
"variable.parameter" = "black" # c // devdraw.c line 26
"variable.other.member" = "black" # screenimage // devdraw.c line 26
"label" = "#0d0b07" # goto "thiscolor"
"punctuation" = "purple" # doesn't seem to do anything
"punctuation.delimiter" = "#393939" # pointer (c)
"punctuation.bracket" = "grey0" # [[
"punctuation.special" = { fg = "fg", modifiers = ["italic"] } # $1, $HOME, the 'dollar sign'
"keyword" = "grey1" # export (sh)
"keyword.control" = "grey2" # for, if, while
"keyword.operator" = "red"
"keyword.directive" = "grey2" # include (c)
"keyword.storage" = "grey1" # static (c)
"operator" = "#393939" # ==
"function" = { fg = "black", modifiers = ["bold"] }
"function.macro" = "green"
"tag" = "orange"
"namespace" = { fg = "yellow", modifiers = ["italic"] }
"attribute" = { fg = "purple", modifiers = ["italic"] }
"constructor" = "green"
"module" = "yellow"
"special" = "blue"

"markup.heading.marker" = "grey1"
"markup.heading.1" = { fg = "red", modifiers = ["bold"] }
"markup.heading.2" = { fg = "orange", modifiers = ["bold"] }
"markup.heading.3" = { fg = "yellow", modifiers = ["bold"] }
"markup.heading.4" = { fg = "green", modifiers = ["bold"] }
"markup.heading.5" = { fg = "blue", modifiers = ["bold"] }
"markup.heading.6" = { fg = "purple", modifiers = ["bold"] }
"markup.list" = "red"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "blue", underline = { style = "line" } }
"markup.link.label" = "orange"
"markup.link.text" = "purple"
"markup.quote" = "grey1"
"markup.raw.inline" = "green"
"markup.raw.block" = "aqua"

"diff.plus" = "green"
"diff.delta" = { fg = "fg", modifiers = ["bold"] } # branch name in commit
"diff.minus" = "red"

"ui.selection" = { bg = "#72dec2" }
"ui.cursor" = { fg = "bg1", bg = "grey2" }
"ui.cursor.insert" = { fg = "bg0", bg = "grey1" }
"ui.cursor.select" = { fg = "bg0", bg = "blue" }
"ui.cursor.match" = { bg = "bg4", modifiers = ["bold"] }
"ui.cursor.primary" = { fg = "bg0", bg = "fg" }
"ui.cursorline.primary" = { bg = "bg1" }
"ui.cursorline.secondary" = { bg = "bg2" }

"ui.background" = { bg = "bg0" }
"ui.background.separator" = "grey0"
"ui.linenr" = "grey0"
"ui.linenr.selected" = "grey2"
"ui.statusline" = { fg = "#887777", bg = "#f6f9e1" }
# "ui.statusline.inactive" = { fg = "#ff00dd", bg = "bg1" }
"ui.statusline.normal" = { fg = "DBlack", bg = "#f6f9e1", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "DBlack", bg = "statusline1", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "DBlack", bg = "#72dec2", modifiers = ["bold"] }

"ui.bufferline" = { fg = "grey2", bg = "bg3" }
"ui.bufferline.active" = { fg = "bg0", bg = "statusline1", modifiers = [
  "bold",
] }
"ui.popup" = { fg = "grey2", bg = "bg2" }
"ui.picker.header" = { modifiers = ["bold", "underlined"] }
"ui.window" = { fg = "bg4", bg = "bg_dim" }
"ui.help" = { fg = "fg", bg = "bg2" }
"ui.text" = "fg"
"ui.text.directory" = { fg = "green" }
"ui.text.focus" = "fg"
"ui.menu" = { fg = "fg", bg = "bg3" }
"ui.menu.selected" = { fg = "bg0", bg = "green" }
"ui.virtual.ruler" = { bg = "bg1" }
"ui.virtual.whitespace" = { fg = "bg4" }
"ui.virtual.indent-guide" = { fg = "bg4" }
"ui.virtual.inlay-hint" = { fg = "grey0" }
"ui.virtual.wrap" = { fg = "grey0" }

"hint" = "green"
"info" = "blue"
"warning" = "yellow"
"error" = "red"

"diagnostic.hint" = { underline = { color = "green", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.warning" = { underline = { color = "yellow", style = "curl" } }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

[palette]
bg_dim = "#e5dfc5"
bg0 = "#ffffea"
bg1 = "#f6f9e1"
bg2 = "#e5dfc5"
bg3 = "#ddd8be"
bg4 = "#d8d3ba"
bg5 = "#b9c0ab"

DBlack = "#000000"
DWhite = "#ffffff"

black = "#000000"
fg = "#5c6a72"
red = "#f85552"
orange = "#f57d26"
yellow = "#dfa000"
green = "#8da101"
blue = "#3a94c5"
aqua = "#35a77c"
purple = "#df69ba"

grey0 = "#939f91"
grey1 = "#829181"
grey2 = "#5c6a72"
statusline1 = "#93b259"
statusline2 = "#708089"
statusline3 = "#e66868"
