show panel desks
show panel clock
show panel load

resizable false

style button.bg 0xffa500
style button.image_size 32
style button.image_position center

panel desks {
    cell 32 32
    grid 2 2
    bg 0xffa500

    row height 32 {
        button "0" "desk -t #{panel_output} -d 0" image zero.xpm icon_only true
        button "1" "desk -t #{panel_output} -d 1" image one.xpm icon_only true
    }
    row height 32 {
        button "2" "desk -t #{panel_output} -d 2" image two.xpm icon_only true
        button "3" "desk -t #{panel_output} -d 3" image three.xpm icon_only true
    }
}
panel clock {
    cell 64 64
    grid 1 1
    bg 0xffa500

    row height 64 {
        external "asclock" width 64 height 64 frame 0 padding 0 \
            app_id asclock use_old true respawn true
    }
}
panel load {
    cell 128 16
    grid 1 1
    bg 0xffa500

    row height 16 {
        external "xload -nolabel -geometry 128x12+0+0 -bg dimgrey -fg white" \
            width 128 height 16 frame 0 padding 0 \
            app_id xload use_old true respawn true
    }
}
